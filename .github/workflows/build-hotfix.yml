name: Build StarSea Hotfix Test Dex

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "源码分支/tag/commit"
        required: false
        default: "main"

jobs:
  build-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      SOURCE_REPO: thomas666-u/starsea-app
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-hotfix-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-hotfix-${{ runner.os }}-
            gradle-fast-${{ runner.os }}-

      - name: Build hotfix-test AAR
        run: ./gradlew :hotfix-test:assembleRelease --no-daemon --no-parallel

      - name: D8 to dex
        run: |
          set -e
          JAR=$(find hotfix-test/build/intermediates -name classes.jar | grep -E 'aar_main_jar|javac' | head -1)
          test -n "$JAR"
          D8=$ANDROID_HOME/build-tools/36.0.0/d8
          test -x "$D8" || D8=$ANDROID_HOME/build-tools/35.0.0/d8
          rm -rf out && mkdir -p out
          "$D8" --min-api 23 --output out "$JAR"
          ls -lh out/classes.dex
          sha256sum out/classes.dex
          cp out/classes.dex hotfix-test-patch.dex

      - name: Upload dex
        uses: actions/upload-artifact@v4
        with:
          name: hotfix-test-dex
          path: hotfix-test-patch.dex
          if-no-files-found: error

name: Build StarSea Hotfix Dex
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "源仓库分支/tag/commit（默认 main）"
        required: false
        default: "main"

concurrency:
  group: build-hotfix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      SOURCE_REPO: thomas666-u/starsea-app
    steps:
      - name: Checkout source from private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 1
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Ensure Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-hotfix-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-hotfix-${{ runner.os }}-
            gradle-fast-${{ runner.os }}-
      - name: Setup CI environment
        run: |
          mkdir -p ~/.gradle
          {
            echo "android.aapt2FromMavenOverride="
            echo "org.gradle.daemon=false"
            echo "org.gradle.parallel=false"
            echo "org.gradle.configuration-cache=false"
            echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
          } >> ~/.gradle/gradle.properties
      - name: Build hotfix AAR
        run: |
          chmod +x ./gradlew
          ./gradlew :hotfix-test:assembleRelease --no-daemon --no-parallel
      - name: Convert AAR to dex
        run: |
          set -e
          AAR=hotfix-test/build/outputs/aar/hotfix-test-release.aar
          test -f "$AAR"
          mkdir -p /tmp/hotfix
          unzip -p "$AAR" classes.jar > /tmp/hotfix/classes.jar
          D8=$(find "$ANDROID_HOME/build-tools" -type f -name d8 | sort -V | tail -1)
          ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -type f -name android.jar | sort -V | tail -1)
          echo "d8=$D8 android=$ANDROID_JAR"
          "$D8" --min-api 24 --lib "$ANDROID_JAR" --output /tmp/hotfix /tmp/hotfix/classes.jar
          cp /tmp/hotfix/classes.dex FeatureIntro_20261027.dex
          SHA=$(sha256sum FeatureIntro_20261027.dex | awk '{print $1}')
          SIZE=$(stat -c%s FeatureIntro_20261027.dex)
          cat > hotfix-manifest.json <<EOF
          {
            "enabled": true,
            "id": "feature-intro-20261027",
            "version": 3,
            "package": "com.stars.app",
            "minVc": 189,
            "maxVc": 999999,
            "url": "/hotfix/FeatureIntro_20261027.dex",
            "sha256": "$SHA",
            "size": $SIZE,
            "entryClasses": [
              "com.stars.app.hotfix.StableTipPatch",
              "com.stars.app.hotfix.ThirdPartyOffPatch",
              "com.stars.app.hotfix.FeatureIntroPatch"
            ]
          }
          EOF
          cat hotfix-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: starsea-hotfix-feature-intro
          path: |
            FeatureIntro_20261027.dex
            hotfix-manifest.json
          retention-days: 14
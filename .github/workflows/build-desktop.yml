name: Build StarSea Desktop (Windows 优先)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "源仓库分支/tag/commit（默认 desktop）"
        required: false
        default: "desktop"
      build_native:
        description: "是否构建 GraalVM Native（实验性，慢）"
        required: false
        default: "false"

jobs:
  # ============ 主产物：Windows 便携版（app-image，必成功）+ msi（尽力而为） ============
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SOURCE_REPO: thomas666-u/Starseatool
    steps:
      - name: Checkout source from private repo (desktop branch)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-desktop-win-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-desktop-win-

- name: Build app-image (必产物：uber jar + 原生 jpackage，绕开 Compose 打包层)
        shell: bash
        run: |
          set -x
          # 1) 打 uber jar（Compose 插件的 jpackage 层有 Input length=1 bug，绕开）
          ./gradlew :desktop-app:packageUberJarForCurrentOS --no-daemon --console=plain 2>&1 | tee /tmp/build.log
          # jar 名形如 StarSea-windows-x64-1.0.0.jar
          JAR=$(ls desktop-app/build/compose/jars/StarSea-*.jar 2>/dev/null | head -1)
          if [ -z "$JAR" ]; then
            echo "FATAL: uber jar 未生成"; ls desktop-app/build/compose/jars/ 2>/dev/null; exit 1
          fi
          echo "uber jar OK: $JAR"
          JAR_DIR=$(dirname "$JAR")
          # 1.5) 下载 gopeed CLI 放进 --input 目录（jpackage 会拷入 StarSea/app/，
          #      GopeedEngine 从自身 jar 所在目录查找 = StarSea/app/gopeed.exe）
          if curl -sL --retry 3 -o "$JAR_DIR/gopeed.exe" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/gopeed-cli/gopeed-cli-win-x64.exe" \
            && [ -s "$JAR_DIR/gopeed.exe" ]; then
            echo "gopeed.exe bundled: $(du -h "$JAR_DIR/gopeed.exe" | cut -f1)"
          else
            echo "::warning::gopeed CLI 下载失败，本次不捆绑高速下载核心"
          fi
          # 2) 用 JDK 自带 jpackage 直接打 app-image（不经 Compose 插件）
          rm -rf desktop-app/build/jpackage-out
          "$JAVA_HOME/bin/jpackage.exe" \
            --type app-image \
            --name StarSea \
            --input "$JAR_DIR" \
            --main-jar "$(basename "$JAR")" \
            --main-class com.stars.app.MainKt \
            --dest desktop-app/build/jpackage-out \
            --win-console \
            --java-options "-Xmx512m" 2>&1 | tee -a /tmp/build.log
          JP_EXIT=$?
          echo "jpackage exit: $JP_EXIT"
          test -d "desktop-app/build/jpackage-out/StarSea" || {
            echo "FATAL: app-image 未生成"; exit 1; }
          echo "app-image OK"

      - name: Build msi (尽力而为，失败不阻断)
        shell: bash
        continue-on-error: true
        run: |
          set +e
          ./gradlew :desktop-app:packageMsi --no-daemon --console=plain 2>&1 | tee -a /tmp/build.log
          echo "===== msi jpackage logs ====="
          find desktop-app/build/compose/logs/packageMsi -name "*.txt" -exec sh -c 'echo "--- {} ---"; cat "{}"' \; 2>/dev/null || true
          ls desktop-app/build/compose/binaries/main/msi/ 2>/dev/null || echo "msi 未产出"

      - name: Prepare artifacts
        shell: bash
        run: |
          TAG=$(date +%Y%m%d_%H%M%S)
          # msi（Compose 插件路径，可能没有）
          if ls desktop-app/build/compose/binaries/main/msi/*.msi 1>/dev/null 2>&1; then
            cp desktop-app/build/compose/binaries/main/msi/*.msi "StarSea_Win_MSI_$TAG.msi"
          fi
          # 便携版 zip（必产物，来自原生 jpackage 的 app-image）
          (cd desktop-app/build/jpackage-out && 7z a -tzip "$GITHUB_WORKSPACE/StarSea_Win_Portable_$TAG.zip" StarSea)
          tar czf "build_log_win_$TAG.tar.gz" /tmp/build.log 2>/dev/null || true
          echo "BUILD_TAG=$TAG" >> $GITHUB_ENV
          ls -la *.msi *.zip 2>/dev/null || true

      - name: Upload diagnostics (if build failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jpackage-diagnostics
          if-no-files-found: ignore
          path: |
            jpackage_diag.tar.gz
            /tmp/build.log

      - name: Upload artifacts (GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: StarSea-windows-x64
          if-no-files-found: error
          path: |
            StarSea_Win_*.msi
            StarSea_Win_*.zip

      - name: Install Python deps
        run: pip install requests -q
        shell: bash

      - name: Upload Windows packages to Lanzou (Build folder)
        env:
          LANZOU_USER: ${{ secrets.LANZOU_USER }}
          LANZOU_PASS: ${{ secrets.LANZOU_PASS }}
        shell: bash
        run: |
          TAG=${{ env.BUILD_TAG }}
          for f in "StarSea_Win_MSI_$TAG.msi" "StarSea_Win_Portable_$TAG.zip"; do
            [ -f "$f" ] && python3 scripts/lanzou_upload.py upload-nolog "$f" "$f" "Build" "$LANZOU_USER" "$LANZOU_PASS" 2>/dev/null || true
          done

      - name: Upload build log to Lanzou (logs folder)
        env:
          LANZOU_USER: ${{ secrets.LANZOU_USER }}
          LANZOU_PASS: ${{ secrets.LANZOU_PASS }}
        shell: bash
        run: |
          TAG=${{ env.BUILD_TAG }}
          [ -f "build_log_win_$TAG.tar.gz" ] && python3 scripts/lanzou_upload.py upload-nolog "build_log_win_$TAG.tar.gz" "build_log_win_$TAG.tar.gz" "logs" "$LANZOU_USER" "$LANZOU_PASS" 2>/dev/null || true

      - name: Cleanup old builds (keep 5)
        env:
          LANZOU_USER: ${{ secrets.LANZOU_USER }}
          LANZOU_PASS: ${{ secrets.LANZOU_PASS }}
        shell: bash
        run: |
          python3 scripts/lanzou_upload.py cleanup "Build" 5 "$LANZOU_USER" "$LANZOU_PASS" 2>/dev/null || true
          python3 scripts/lanzou_upload.py cleanup "logs" 5 "$LANZOU_USER" "$LANZOU_PASS" 2>/dev/null || true

  # ============ Linux：仅 GitHub artifacts（不上传蓝奏云） ============
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_REPO: thomas666-u/Starseatool
    steps:
      - name: Checkout source from private repo (desktop branch)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-desktop-linux-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-desktop-linux-

      - name: Build Linux app-image
        run: |
          ./gradlew :desktop-app:packageAppImage --no-daemon --console=plain 2>&1 | tee /tmp/build.log
          test -d "desktop-app/build/compose/binaries/main/app/StarSea" || {
            echo "FATAL: app-image 未生成"; exit 1; }

      - name: Prepare artifacts
        run: |
          TAG=$(date +%Y%m%d_%H%M%S)
          cd desktop-app/build/compose/binaries/main/app
          zip -rq "$GITHUB_WORKSPACE/StarSea_Linux_Portable_$TAG.zip" StarSea
          cd "$GITHUB_WORKSPACE"
          echo "BUILD_TAG=$TAG" >> $GITHUB_ENV

      - name: Upload artifacts (GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: StarSea-linux-x64
          if-no-files-found: error
          path: |
            StarSea_Linux_*.zip

  # ============ 实验性：GraalVM Native Image（可能失败） ============
  native-windows:
    if: ${{ github.event.inputs.build_native == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 90
    continue-on-error: true
    env:
      SOURCE_REPO: thomas666-u/Starseatool
    steps:
      - name: Checkout source from private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 1

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: "latest"
          java-version: "17"
          components: "native-image"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build classpath then native image
        shell: pwsh
        run: |
          # 1) 编译到 classes（不出 fat jar），2) 用 runtimeClasspath 原始 jar 列表做 -cp
          .\gradlew.bat :desktop-app:compileKotlin :desktop-app:printRuntimeClasspath --no-daemon --console=plain > gradle-out.txt 2>&1
          if ($LASTEXITCODE -ne 0) { Get-Content gradle-out.txt | Select-Object -Last 60; exit 1 }

          # 从 gradle 输出提取 classpath 行（printRuntimeClasspath 任务输出的绝对路径）
          $cpLines = Select-String -Path gradle-out.txt -Pattern '^([A-Za-z]:[\\/].+\.jar)$' -AllMatches |
            ForEach-Object { $_.Matches[0].Groups[1].Value } | Select-Object -Unique
          Write-Host "Found $($cpLines.Count) classpath jars"

          # 应用 classes 目录 + 资源目录（含 META-INF/native-image 配置）
          $classesDir = "desktop-app\build\classes\kotlin\main"
          $resourcesDir = "desktop-app\build\resources\main"
          $cp = (@($classesDir, $resourcesDir) + $cpLines) -join ';'
          Write-Host "CP length: $($cp.Length)"
          $cp | Out-File -Encoding ascii cp.txt

          # native-image：完整 classpath（原始 jar 保留 MR-JAR，SqliteJdbcFeature 可被加载，
          # 同时 jar 内的 native-image.properties 会自动注册 feature 与资源配置）
          # Windows cmd 8191 字符限制 → classpath 写入 @argfile 传递（argfile 内每行一个参数）
          "-cp", "`"$cp`"" | Set-Content -Encoding ascii cp-arg.txt
          native-image.cmd `
            @cp-arg.txt `
            -H:Name=StarSea `
            -H:Path=native-build `
            -H:+ReportUnsupportedElementsAtRuntime `
            -H:JNIConfigurationFiles=desktop-app\src\jvmMain\resources\META-INF\native-image\jni-config.json `
            -H:ResourceConfigurationFiles=desktop-app\src\jvmMain\resources\META-INF\native-image\resource-config.json `
            -H:ReflectionConfigurationFiles=desktop-app\src\jvmMain\resources\META-INF\native-image\reflect-config.json `
            -J-Xmx6g `
            --no-fallback `
            com.stars.app.MainKt

      - name: Upload native exe (if built)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StarSea-native-windows-experimental
          if-no-files-found: ignore
          path: |
            native-build/*.exe
            desktop-app/native-build/*.exe
name: Build StarSea Desktop (Windows 优先)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "源仓库分支/tag/commit（默认 desktop）"
        required: false
        default: "desktop"
      build_native:
        description: "是否构建 GraalVM Native（实验性，慢）"
        required: false
        default: "false"

jobs:
  # ============ 主产物：Windows msi + 便携版 ============
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SOURCE_REPO: thomas666-u/Starseatool
    steps:
      - name: Checkout source from private repo (desktop branch)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-desktop-win-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-desktop-win-

      - name: Build Windows packages (msi + app-image)
        shell: bash
        run: |
          # 先构建（允许 msi 打包失败，但编译必须成功）
          set +e
          ./gradlew :desktop-app:packageDistributionForCurrentOS --no-daemon --console=plain 2>&1 | tee /tmp/build.log
          GRADLE_EXIT=$?
          set -e
          # 编译失败（没有 app-image）才真正报错
          if [ ! -d "desktop-app/build/compose/binaries/main/app/StarSea" ]; then
            echo "FATAL: app-image 未生成，编译失败"
            exit $GRADLE_EXIT
          fi
          echo "app-image 生成成功（msi 状态见上方日志，exit=$GRADLE_EXIT）"

      - name: Prepare artifacts
        shell: bash
        run: |
          B=desktop-app/build/compose/binaries/main
          TAG=$(date +%Y%m%d_%H%M%S)
          # msi 安装包
          if ls "$B/msi/"*.msi 1>/dev/null 2>&1; then
            cp "$B/msi/"*.msi "StarSea_Win_MSI_$TAG.msi"
          fi
          # 便携版 zip（必产物）
          if [ -d "$B/app/StarSea" ]; then
            (cd "$B/app" && 7z a -tzip "$GITHUB_WORKSPACE/StarSea_Win_Portable_$TAG.zip" StarSea)
          fi
          # 日志
          tar czf "build_log_win_$TAG.tar.gz" /tmp/build.log 2>/dev/null || true
          echo "BUILD_TAG=$TAG" >> $GITHUB_ENV
          ls -la *.msi *.zip 2>/dev/null || true

      - name: Upload artifacts (GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: StarSea-windows-x64
          if-no-files-found: error
          path: |
            StarSea_Win_*.msi
            StarSea_Win_*.zip

      - name: Install Python deps
        run: pip install requests -q
        shell: bash

      - name: Upload Windows packages to Lanzou (Build folder)
        env:
          LANZOU_USER: ${{ secrets.LANZOU_USER }}
          LANZOU_PASS: ${{ secrets.LANZOU_PASS }}
        shell: bash
        run: |
          TAG=${{ env.BUILD_TAG }}
          for f in "StarSea_Win_MSI_$TAG.msi" "StarSea_Win_Portable_$TAG.zip"; do
            [ -f "$f" ] && python3 scripts/lanzou_upload.py upload-nolog "$f" "$f" "Build" "$LANZOU_USER" "$LANZOU_PASS" 2>/dev/null || true
          done

      - name: Upload build log to Lanzou (logs folder)
        env:
          LANZOU_USER: ${{ secrets.LANZOU_USER }}
          LANZOU_PASS: ${{ secrets.LANZOU_PASS }}
        shell: bash
        run: |
          TAG=${{ env.BUILD_TAG }}
          [ -f "build_log_win_$TAG.tar.gz" ] && python3 scripts/lanzou_upload.py upload-nolog "build_log_win_$TAG.tar.gz" "build_log_win_$TAG.tar.gz" "logs" "$LANZOU_USER" "$LANZOU_PASS" 2>/dev/null || true

      - name: Cleanup old builds (keep 5)
        env:
          LANZOU_USER: ${{ secrets.LANZOU_USER }}
          LANZOU_PASS: ${{ secrets.LANZOU_PASS }}
        shell: bash
        run: |
          python3 scripts/lanzou_upload.py cleanup "Build" 5 "$LANZOU_USER" "$LANZOU_PASS" 2>/dev/null || true
          python3 scripts/lanzou_upload.py cleanup "logs" 5 "$LANZOU_USER" "$LANZOU_PASS" 2>/dev/null || true

  # ============ 次要：Linux app-image + deb ============
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_REPO: thomas666-u/Starseatool
    steps:
      - name: Checkout source from private repo (desktop branch)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-desktop-linux-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-desktop-linux-

      - name: Build Linux packages
        shell: bash
        run: |
          set +e
          ./gradlew :desktop-app:packageDistributionForCurrentOS --no-daemon --console=plain 2>&1 | tee /tmp/build.log
          GRADLE_EXIT=$?
          set -e
          if [ ! -d "desktop-app/build/compose/binaries/main/app/StarSea" ]; then
            echo "FATAL: app-image 未生成，编译失败"
            exit $GRADLE_EXIT
          fi

      - name: Prepare artifacts
        shell: bash
        run: |
          TAG=$(date +%Y%m%d_%H%M%S)
          B=desktop-app/build/compose/binaries/main
          # 便携版 zip
          if [ -d "$B/app/StarSea" ]; then
            (cd "$B/app" && zip -rq "$GITHUB_WORKSPACE/StarSea_Linux_Portable_$TAG.zip" StarSea)
          fi
          # deb（可能失败，容错）
          ls "$B/deb/"*.deb 1>/dev/null 2>&1 && cp "$B/deb/"*.deb "StarSea_Linux_$TAG.deb" || true
          tar czf "build_log_linux_$TAG.tar.gz" /tmp/build.log 2>/dev/null || true
          echo "BUILD_TAG=$TAG" >> $GITHUB_ENV

      - name: Upload artifacts (GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: StarSea-linux-x64
          if-no-files-found: warn
          path: |
            StarSea_Linux_*.zip
            StarSea_Linux_*.deb

      - name: Install Python deps
        run: pip install requests -q
        shell: bash

      - name: Upload Linux packages to Lanzou
        env:
          LANZOU_USER: ${{ secrets.LANZOU_USER }}
          LANZOU_PASS: ${{ secrets.LANZOU_PASS }}
        shell: bash
        run: |
          TAG=${{ env.BUILD_TAG }}
          for f in "StarSea_Linux_Portable_$TAG.zip" "StarSea_Linux_$TAG.deb"; do
            [ -f "$f" ] && python3 scripts/lanzou_upload.py upload-nolog "$f" "$f" "Build" "$LANZOU_USER" "$LANZOU_PASS" 2>/dev/null || true
          done
          [ -f "build_log_linux_$TAG.tar.gz" ] && python3 scripts/lanzou_upload.py upload-nolog "build_log_linux_$TAG.tar.gz" "build_log_linux_$TAG.tar.gz" "logs" "$LANZOU_USER" "$LANZOU_PASS" 2>/dev/null || true

  # ============ 实验性：GraalVM Native Image（可能失败） ============
  native-windows:
    if: ${{ github.event.inputs.build_native == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 90
    continue-on-error: true
    env:
      SOURCE_REPO: thomas666-u/Starseatool
    steps:
      - name: Checkout source from private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 1

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: "latest"
          java-version: "17"
          components: "native-image"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build uber jar then native image
        shell: cmd
        run: |
          call gradlew.bat :desktop-app:packageUberJarForCurrentOS --no-daemon --console=plain
          dir desktop-app\build\compose\jars

          native-image.cmd ^
            -H:Name=StarSea ^
            -H:Path=native-build ^
            -H:+ReportUnsupportedElementsAtRuntime ^
            -J-Xmx6g ^
            --no-fallback ^
            -jar desktop-app\build\compose\jars\StarSea-desktop-app-1.0.0.jar

      - name: Upload native exe (if built)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StarSea-native-windows-experimental
          if-no-files-found: ignore
          path: |
            desktop-app/native-build/*.exe
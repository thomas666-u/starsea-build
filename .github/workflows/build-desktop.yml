name: Build StarSea Desktop (Windows 优先)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "源仓库分支/tag/commit（默认 desktop）"
        required: false
        default: "desktop"
      build_native:
        description: "是否构建 GraalVM Native（实验性，慢）"
        required: false
        default: "false"

jobs:
  # ============ 主产物：Windows 便携版（app-image，必成功）+ msi（尽力而为） ============
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SOURCE_REPO: thomas666-u/Starseatool
    steps:
      - name: Checkout source from private repo (desktop branch)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-desktop-win-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-desktop-win-

      - name: Build app-image (必产物：uber jar + 原生 jpackage，绕开 Compose 打包层)
        shell: bash
        run: |
          set -x
          # 1) 打 uber jar（Compose 插件的 jpackage 层有 Input length=1 bug，绕开）
          ./gradlew :desktop-app:packageUberJarForCurrentOS --no-daemon --console=plain 2>&1 | tee /tmp/build.log
          # jar 名形如 StarSea-windows-x64-1.0.0.jar
          JAR=$(ls desktop-app/build/compose/jars/StarSea-*.jar 2>/dev/null | head -1)
          if [ -z "$JAR" ]; then
            echo "FATAL: uber jar 未生成"; ls desktop-app/build/compose/jars/ 2>/dev/null; exit 1
          fi
          echo "uber jar OK: $JAR"
          JAR_DIR=$(dirname "$JAR")
          # 1.5) 下载 gopeed CLI 放进 --input 目录（jpackage 会拷入 StarSea/app/，
          #      GopeedEngine 从自身 jar 所在目录查找 = StarSea/app/gopeed.exe）
          if curl -sL --retry 3 -o "$JAR_DIR/gopeed.exe" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/gopeed-cli/gopeed-cli-win-x64.exe" \
            && [ -s "$JAR_DIR/gopeed.exe" ]; then
            echo "gopeed.exe bundled: $(du -h "$JAR_DIR/gopeed.exe" | cut -f1)"
          else
            echo "::warning::gopeed CLI 下载失败，本次不捆绑高速下载核心"
          fi

          # 1.6) ★ jlink 裁剪 JRE：默认 jpackage 会塞全量 JDK（68 模块/136MB）。
          #   jdeps 分析 uber jar 实际只需 5 个模块（java.base,java.desktop,java.instrument,
          #   java.sql,jdk.unsupported），加上运行时隐性需求（logging/management/crypto.ec/
          #   localedata 中文/naming/sql.rowset/java.net.http）共 11 个 → JRE ~40MB。
          #   总包体积从 143MB 降到 ~65MB（含 gopeed 41MB）。
          echo "===== jlink 定制 JRE ====="
          JLINK_DIR=desktop-app/build/jlink-runtime
          rm -rf "$JLINK_DIR"
          "$JAVA_HOME/bin/jlink.exe" \
            --add-modules java.base,java.desktop,java.instrument,java.sql,java.sql.rowset,java.logging,java.management,java.naming,java.net.http,jdk.unsupported,jdk.crypto.ec,jdk.localedata \
            --strip-debug \
            --no-man-pages \
            --no-header-files \
            --compress=2 \
            --output "$JLINK_DIR" 2>&1 | tee -a /tmp/build.log
          test -f "$JLINK_DIR/bin/java.exe" || {
            echo "FATAL: jlink JRE 未生成"; exit 1; }
          echo "jlink JRE OK: $(du -sh "$JLINK_DIR" | cut -f1)"

          # 2) 用 JDK 自带 jpackage 直接打 app-image（不经 Compose 插件）；
          #    --runtime-image 指向 jlink 裁剪的 JRE（关键：不传则 jpackage 打全量 JDK）
          rm -rf desktop-app/build/jpackage-out
          "$JAVA_HOME/bin/jpackage.exe" \
            --type app-image \
            --name StarSea \
            --input "$JAR_DIR" \
            --main-jar "$(basename "$JAR")" \
            --main-class com.stars.app.MainKt \
            --runtime-image "$JLINK_DIR" \
            --dest desktop-app/build/jpackage-out \
            --win-console \
            --java-options "-Xmx512m" 2>&1 | tee -a /tmp/build.log
          JP_EXIT=$?
          echo "jpackage exit: $JP_EXIT"
          test -d "desktop-app/build/jpackage-out/StarSea" || {
            echo "FATAL: app-image 未生成"; exit 1; }
          echo "app-image OK ($(du -sh desktop-app/build/jpackage-out/StarSea | cut -f1))"

      - name: Build msi (尽力而为，失败不阻断)
        shell: bash
        continue-on-error: true
        run: |
          set +e
          ./gradlew :desktop-app:packageMsi --no-daemon --console=plain 2>&1 | tee -a /tmp/build.log
          echo "===== msi jpackage logs ====="
          find desktop-app/build/compose/logs/packageMsi -name "*.txt" -exec sh -c 'echo "--- {} ---"; cat "{}"' \; 2>/dev/null || true
          ls desktop-app/build/compose/binaries/main/msi/ 2>/dev/null || echo "msi 未产出"

      - name: Prepare artifacts
        shell: bash
        run: |
          TAG=$(date +%Y%m%d_%H%M%S)
          APP=desktop-app/build/jpackage-out/StarSea

          # ★ 打包前自检：JRE 结构必须完整，否则解压后运行会报
          #   "cannot open runtime/lib/jvm.cfg"（jpackage app-image 缺 JRE 的典型症状）
          # 注意：JRE 布局平台不同 ——
          #   Windows jpackage: StarSea/runtime/lib/jvm.cfg（runtime 在顶层）
          #   Linux   jpackage: StarSea/lib/runtime/lib/jvm.cfg（runtime 在 lib 下）
          echo "===== app-image 结构自检 ====="
          JE=""
          for cand in "$APP/runtime/lib/jvm.cfg" "$APP/lib/runtime/lib/jvm.cfg"; do
            if [ -f "$cand" ]; then JE="$cand"; break; fi
          done
          if [ -z "$JE" ]; then
            echo "::error::jvm.cfg 缺失 —— app-image 的 JRE 不完整"
            echo "--- 顶层 ---"; ls -la "$APP" 2>/dev/null
            echo "--- 全域搜索 jvm.cfg ---"; find "$APP" -name "jvm.cfg" 2>/dev/null || true
            exit 1
          fi
          echo "jvm.cfg OK: $JE"
          # JRE 相对 app 根的路径（Windows: runtime；Linux: lib/runtime）
          JE_ROOT=$(dirname "$(dirname "$JE")")
          JE_REL=${JE_ROOT#"$APP"/}
          echo "JRE 目录: $JE_REL"
          echo "JRE 文件数: $(find "$JE_ROOT" -type f 2>/dev/null | wc -l)"
          echo "app-image 总文件数: $(find "$APP" -type f 2>/dev/null | wc -l)"
          echo "app-image 总大小: $(du -sh "$APP" 2>/dev/null | cut -f1)"
          # 写成环境变量供打包后校核
          echo "JE_REL=$JE_REL" >> $GITHUB_ENV

          # ★ 打包：Python zipfile（跨平台 100% 可靠）。
          #   MSYS zip -r 带反斜杠绝对路径会产出 268MB 垃圾头的坏 zip；
          #   bsdtar -a 产出的 zip 用户侧报无效。Python zipfile 无任何怪癖。
          #   脚本内置 testzip 完整性校验 + jvm.cfg 存在性校验。
          ZIP_NAME="StarSea_Win_Portable_$TAG.zip"
          python3 scripts/zip_app.py desktop-app/build/jpackage-out/StarSea "$PWD/$ZIP_NAME"
          ZIP_ABS="$PWD/$ZIP_NAME"

          # zip_app.py 已内置完整性 + jvm.cfg 校验；这里再独立复核一次（双保险）
          echo "===== zip 独立复核 ====="
          unzip -l "$ZIP_ABS" | grep -q "jvm.cfg" || { echo "::error::独立复核失败"; exit 1; }
          unzip -t "$ZIP_ABS" > /dev/null 2>&1 || { echo "::error::zip 已损坏"; exit 1; }
          echo "zip 独立复核通过 ✓ 大小: $(du -h "$ZIP_ABS" | cut -f1)"

          # msi（Compose 插件路径，可能没有）
          if ls desktop-app/build/compose/binaries/main/msi/*.msi 1>/dev/null 2>&1; then
            cp desktop-app/build/compose/binaries/main/msi/*.msi "StarSea_Win_MSI_$TAG.msi"
          fi
          tar czf "build_log_win_$TAG.tar.gz" /tmp/build.log 2>/dev/null || true
          echo "BUILD_TAG=$TAG" >> $GITHUB_ENV
          ls -la *.msi *.zip 2>/dev/null || true

      - name: Upload diagnostics (if build failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jpackage-diagnostics
          if-no-files-found: ignore
          path: |
            jpackage_diag.tar.gz
            /tmp/build.log

      - name: Upload artifacts (GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: StarSea-windows-x64
          if-no-files-found: error
          path: |
            StarSea_Win_*.msi
            StarSea_Win_*.zip

      - name: Install Python deps
        run: pip install requests -q
        shell: bash

      - name: Upload Windows packages to Lanzou (Build folder)
        env:
          LANZOU_USER: ${{ secrets.LANZOU_USER }}
          LANZOU_PASS: ${{ secrets.LANZOU_PASS }}
        shell: bash
        run: |
          TAG=${{ env.BUILD_TAG }}
          for f in "StarSea_Win_MSI_$TAG.msi" "StarSea_Win_Portable_$TAG.zip"; do
            [ -f "$f" ] && timeout 1500 python3 scripts/lanzou_upload.py upload-nolog "$f" "$f" "Build" "$LANZOU_USER" "$LANZOU_PASS" 2>/dev/null || echo "::warning::蓝奏云上传超时/失败（$f），产物已在 GitHub artifacts" 
          done

      - name: Upload build log to Lanzou (logs folder)
        env:
          LANZOU_USER: ${{ secrets.LANZOU_USER }}
          LANZOU_PASS: ${{ secrets.LANZOU_PASS }}
        shell: bash
        run: |
          TAG=${{ env.BUILD_TAG }}
          [ -f "build_log_win_$TAG.tar.gz" ] && python3 scripts/lanzou_upload.py upload-nolog "build_log_win_$TAG.tar.gz" "build_log_win_$TAG.tar.gz" "logs" "$LANZOU_USER" "$LANZOU_PASS" 2>/dev/null || true

      - name: Cleanup old builds (keep 5)
        env:
          LANZOU_USER: ${{ secrets.LANZOU_USER }}
          LANZOU_PASS: ${{ secrets.LANZOU_PASS }}
        shell: bash
        run: |
          python3 scripts/lanzou_upload.py cleanup "Build" 5 "$LANZOU_USER" "$LANZOU_PASS" 2>/dev/null || true
          python3 scripts/lanzou_upload.py cleanup "logs" 5 "$LANZOU_USER" "$LANZOU_PASS" 2>/dev/null || true

  # ============ Linux：仅 GitHub artifacts（不上传蓝奏云） ============
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_REPO: thomas666-u/Starseatool
    steps:
      - name: Checkout source from private repo (desktop branch)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-desktop-linux-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-desktop-linux-

      - name: Build Linux app-image
        run: |
          ./gradlew :desktop-app:packageAppImage --no-daemon --console=plain 2>&1 | tee /tmp/build.log
          test -d "desktop-app/build/compose/binaries/main/app/StarSea" || {
            echo "FATAL: app-image 未生成"; exit 1; }

      - name: Prepare artifacts
        run: |
          TAG=$(date +%Y%m%d_%H%M%S)
          cd desktop-app/build/compose/binaries/main/app
          zip -rq "$GITHUB_WORKSPACE/StarSea_Linux_Portable_$TAG.zip" StarSea
          cd "$GITHUB_WORKSPACE"
          echo "BUILD_TAG=$TAG" >> $GITHUB_ENV

      - name: Upload artifacts (GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: StarSea-linux-x64
          if-no-files-found: error
          path: |
            StarSea_Linux_*.zip

  # ============ 实验性：GraalVM Native Image（可能失败） ============
  native-windows:
    if: ${{ github.event.inputs.build_native == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 90
    continue-on-error: true
    env:
      SOURCE_REPO: thomas666-u/Starseatool
    steps:
      - name: Checkout source from private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 1

      - name: Set up GraalVM (JDK 21 —— Windows AWT headful 支持的最低要求版本)
        uses: graalvm/setup-graalvm@v1
        with:
          version: "21"
          java-version: "21"
          distribution: "graalvm"
          components: "native-image"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ⚠️ 已知限制：GraalVM native-image 不支持 Compose Desktop（Skiko 的 SkiaLayer
      # 继承 java.awt.Component，51 处 AWT 引用）。运行时报
      #   NoSuchMethodError: java.awt.Toolkit.getDefaultToolkit()
      # 这是 Skiko/AWT 的底层依赖，无法通过配置绕过。本 job 保留为实验记录（continue-on-error）。
      - name: Build classpath then native image
        shell: pwsh
        run: |
          # 1) 编译到 classes（不出 fat jar），2) 用 runtimeClasspath 原始 jar 列表做 -cp
          .\gradlew.bat :desktop-app:compileKotlin :desktop-app:printRuntimeClasspath --no-daemon --console=plain > gradle-out.txt 2>&1
          if ($LASTEXITCODE -ne 0) { Get-Content gradle-out.txt | Select-Object -Last 60; exit 1 }

          # 从 gradle 输出提取 classpath 行（printRuntimeClasspath 任务输出的绝对路径）
          $cpLines = Select-String -Path gradle-out.txt -Pattern '^([A-Za-z]:[\\/].+\.jar)$' -AllMatches |
            ForEach-Object { $_.Matches[0].Groups[1].Value } | Select-Object -Unique
          Write-Host "Found $($cpLines.Count) classpath jars"

          # 应用 classes 目录 + 资源目录（含 META-INF/native-image 配置）
          $classesDir = "desktop-app\build\classes\kotlin\main"
          $resourcesDir = "desktop-app\build\resources\main"
          $cp = (@($classesDir, $resourcesDir) + $cpLines) -join ';'
          Write-Host "CP length: $($cp.Length)"
          $cp | Out-File -Encoding ascii cp.txt

          # native-image：完整 classpath（原始 jar 保留 MR-JAR，SqliteJdbcFeature 可被加载，
          # 同时 jar 内的 native-image.properties 会自动注册 feature 与资源配置）
          # Windows cmd 8191 字符限制 → classpath 写入 @argfile 传递
          # 注意 1：Set-Content 写 CRLF 会污染参数 → 用 WriteAllText + LF
          # 注意 2：Java argfile 解析器把 \b \r \n 当转义序列 → 反斜杠换成正斜杠
          $cpFwd = $cp -replace '\\', '/'
          [System.IO.File]::WriteAllText("$PWD\cp-arg.txt", "-cp`n`"$cpFwd`"", [System.Text.Encoding]::ASCII)
          Write-Host "cp-arg.txt written: $((Get-Item cp-arg.txt).Length) bytes"
          native-image.cmd `
            @cp-arg.txt `
            -H:Name=StarSea `
            -H:Path=native-build `
            -H:+ReportUnsupportedElementsAtRuntime `
            -H:JNIConfigurationFiles=desktop-app\src\jvmMain\resources\META-INF\native-image\jni-config.json `
            -H:ResourceConfigurationFiles=desktop-app\src\jvmMain\resources\META-INF\native-image\resource-config.json `
            -H:ReflectionConfigurationFiles=desktop-app\src\jvmMain\resources\META-INF\native-image\reflect-config.json `
            -J-Xmx6g `
            --no-fallback `
            -H:+UseCompressedReferences `
            --initialize-at-run-time=java.awt.Toolkit,java.awt.GraphicsEnvironment,org.jetbrains.skiko.SkiaLayer `
            com.stars.app.MainKt

          # 打印产物清单（含 jvm.dll / lcms.dll 等同目录依赖，缺一不可）
          Write-Host "===== native-build 产物清单 ====="
          Get-ChildItem native-build | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host

      - name: Bundle gopeed CLI next to native exe
        shell: pwsh
        run: |
          $exeDir = "native-build"
          if (Test-Path "$exeDir\StarSea.exe") {
            # 下载 gopeed CLI 放到 exe 并排目录（GopeedEngine 查找路径：自身 jar/exe 同目录 → app 目录 → PATH）
            try {
              Invoke-WebRequest -Uri "https://github.com/$env:GITHUB_REPOSITORY/releases/download/gopeed-cli/gopeed-cli-win-x64.exe" -OutFile "$exeDir\gopeed.exe" -ErrorAction Stop
              Write-Host "gopeed.exe bundled: $((Get-Item "$exeDir\gopeed.exe").Length / 1MB)MB"
            } catch {
              Write-Host "::warning::gopeed CLI download failed: $_"
            }
          } else {
            Write-Host "StarSea.exe not found, skipping gopeed bundle"
          }

      - name: Upload native exe (if built)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StarSea-native-windows-experimental
          if-no-files-found: ignore
          # ★ 必须上传整个 native-build 目录：GraalVM 产物除 StarSea.exe 外，
          #   还生成 jvm.dll(jdk_library_shim) / lcms.dll 等同目录依赖。
          #   只传 *.exe 会导致用户运行时报
          #   "awk not found in javapath"（exe 找不到 jvm.dll → 回退系统 PATH 找 Java）。
          path: |
            native-build/**
            desktop-app/native-build/**
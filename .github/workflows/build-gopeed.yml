name: Build Gopeed .so

on:
  workflow_dispatch:
    inputs:
      gopeed_ref:
        description: "gopeed 上游 ref/commit（默认 cfdf87c）"
        required: false
        default: "cfdf87c3b8aad398290fac0f8989c1e4f8e4b60d"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
      SOURCE_REPO: thomas666-u/Starseatool

    steps:
      - name: Checkout source repo (for patch + lanzou_upload.py)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: main
          fetch-depth: 1

      - name: Checkout gopeed upstream
        uses: actions/checkout@v4
        with:
          repository: GopeedLab/gopeed
          ref: ${{ github.event.inputs.gopeed_ref }}
          path: gopeed
          fetch-depth: 0

      - name: Apply custom patch
        run: |
          cd gopeed
          git apply ../gopeed-patch/custom.patch
          echo "Patch applied"
          git diff --stat

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: gopeed/go.sum

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260821190718-4776eadac327
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install NDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_NDK_HOME=$(ls -d $ANDROID_HOME/ndk/*/ 2>/dev/null | head -1)
          if [ -z "$ANDROID_NDK_HOME" ]; then
            yes | sdkmanager "ndk;27.0.12077973" >/dev/null 2>&1 || true
            export ANDROID_NDK_HOME=$(ls -d $ANDROID_HOME/ndk/*/ 2>/dev/null | head -1)
          fi
          echo "NDK: $ANDROID_NDK_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV

      - name: Build .so via gomobile bind
        working-directory: gopeed
        run: |
          go get golang.org/x/mobile@v0.0.0-20260821190718-4776eadac327
          gomobile init
          gomobile bind \
            -target=android/arm64 \
            -androidapi 23 \
            -ldflags=-checklinkname=0 \
            -o ../libgopeed.aar \
            ./bind/mobile

      - name: Extract and strip .so
        run: |
          mkdir -p /tmp/aar_x && cd /tmp/aar_x
          unzip -o -q "$GITHUB_WORKSPACE/libgopeed.aar"
          cp jni/arm64-v8a/libgojni.so "$GITHUB_WORKSPACE/libgojni-arm64.so"
          STRIP=$(find $ANDROID_NDK_HOME -name llvm-strip | head -1)
          $STRIP --strip-unneeded "$GITHUB_WORKSPACE/libgojni-arm64.so"

      - name: Rename .so to .zip
        run: |
          BUILD_TAG="gopeed_$(date +%Y%m%d_%H%M%S)"
          cp libgojni-arm64.so "libgojni_${BUILD_TAG}.zip"
          echo "BUILD_TAG=$BUILD_TAG" >> $GITHUB_ENV

      - name: Install Python deps
        run: pip install requests -q

      - name: Upload .so to Lanzou (Build folder)
        env:
          LANZOU_USER: ${{ secrets.LANZOU_USER }}
          LANZOU_PASS: ${{ secrets.LANZOU_PASS }}
        run: |
          python3 scripts/lanzou_upload.py upload-nolog "libgojni_${{ env.BUILD_TAG }}.zip" "libgojni_${{ env.BUILD_TAG }}.zip" "Build" "$LANZOU_USER" "$LANZOU_PASS" 2>/dev/null || true

      - name: Cleanup old builds (keep 5)
        env:
          LANZOU_USER: ${{ secrets.LANZOU_USER }}
          LANZOU_PASS: ${{ secrets.LANZOU_PASS }}
        run: |
          python3 scripts/lanzou_upload.py cleanup "Build" 5 "$LANZOU_USER" "$LANZOU_PASS" 2>/dev/null || true
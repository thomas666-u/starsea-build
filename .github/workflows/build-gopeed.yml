# 编译 gopeed libgojni.so（android/arm64）
# ★★★ 2026-10-11 用户指令：主力编译（发布/更新）统一放在 starsea-build 仓库。
#   本仓只负责编译；gopeed 源码（gopeed-src/）私有存放在 thomas666-u/starsea-app，
#   通过 SOURCE_REPO_TOKEN 拉取。此文件与 starsea-app/.github/workflows/build-gopeed.yml
#   保持同步（那边是自包含版，用于直接改核心源码时的快速验证）。

name: Build Gopeed .so

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "gopeed 源码仓库分支/tag/commit（starsea-app，默认 main）"
        required: false
        default: "main"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973

    steps:
      - name: Checkout gopeed source from starsea-app
        uses: actions/checkout@v4
        with:
          repository: thomas666-u/starsea-app
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ github.event.inputs.source_ref || 'main' }}
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: gopeed-src/go.sum

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260821190718-4776eadac327
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install NDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_NDK_HOME=$(ls -d $ANDROID_HOME/ndk/*/ 2>/dev/null | head -1)
          if [ -z "$ANDROID_NDK_HOME" ]; then
            yes | sdkmanager "ndk;27.0.12077973" >/dev/null 2>&1 || true
            export ANDROID_NDK_HOME=$(ls -d $ANDROID_HOME/ndk/*/ 2>/dev/null | head -1)
          fi
          echo "NDK: $ANDROID_NDK_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV

      - name: NDK ready check
        run: echo "NDK_HOME=$ANDROID_NDK_HOME"
      # Guard data-plane gate: build source must NOT contain hooks that throttle
      # or corrupt normal users downloads (DegradeAction/ThrottleDelay/ConnLimit/
      # BiasOffset/SplitBias were the 2026-10 production incident). Evidence-only
      # hooks (Beat/RingSample) are allowed.
      - name: Guard data-plane gate
        working-directory: gopeed-src
        run: |
          echo "=== guard data-plane gate ==="
          if grep -rnE "guard[.](DegradeAction|ThrottleDelay|DegradeStall|ConnLimit|BiasOffset|SplitBias)[(]" --include="*.go" internal/ pkg/ bind/ cmd/ 2>/dev/null | grep -v "_test.go"; then
            echo "FAIL: harmful guard hook found in build source - refusing to build"
            exit 1
          fi
          echo "OK: no harmful guard hooks in data plane"
          echo "--- allowed evidence-only hooks ---"
          grep -rnE "guard[.](Beat|RingSample)[(]" --include="*.go" internal/ pkg/ 2>/dev/null | grep -v "_test.go" || true
          echo "--- build source revision ---"
          git rev-parse HEAD
      - name: Run core test suites (gate)
        working-directory: gopeed-src
        run: |
          echo "=== go vet ==="
          go vet ./internal/guard/ ./internal/protocol/http/ ./internal/httpclient/ ./pkg/download/ || exit 1
          echo "=== guard tests ==="
          go test ./internal/guard/ -count=1 -timeout 120s || exit 1
          echo "=== httpclient tests ==="
          go test ./internal/httpclient/ -count=1 -timeout 120s || exit 1
          echo "=== http protocol tests ==="
          go test ./internal/protocol/http/ -count=1 -timeout 600s || exit 1
          echo "=== downloader tests ==="
          go test ./pkg/download/ -count=1 -timeout 1200s || exit 1
          echo "ALL TESTS PASSED"
      - name: Build .so via gomobile bind
        working-directory: gopeed-src
        env:
          GUARD_KEYS_LD: ${{ secrets.GUARD_KEYS_LD }}
        run: |
          go get golang.org/x/mobile@v0.0.0-20260821190718-4776eadac327
          gomobile init
          if [ -n "$GUARD_KEYS_LD" ]; then
            echo "guard keys injected (kid list: $(echo "$GUARD_KEYS_LD" | cut -d: -f1))"
            gomobile bind \
              -target=android/arm64 \
              -androidapi 23 \
              -ldflags="-checklinkname=0 -X 'github.com/GopeedLab/gopeed/internal/guard.GuardKeysLD=$GUARD_KEYS_LD'" \
              -o ../libgopeed.aar \
              ./bind/mobile
          else
            echo "WARNING: GUARD_KEYS_LD secret not set — building UNARMED so (no license enforcement)"
            gomobile bind \
              -target=android/arm64 \
              -androidapi 23 \
              -ldflags=-checklinkname=0 \
              -o ../libgopeed.aar \
              ./bind/mobile
          fi

      - name: Extract and strip .so
        run: |
          mkdir -p /tmp/aar_x && cd /tmp/aar_x
          unzip -o -q "$GITHUB_WORKSPACE/libgopeed.aar"
          cp jni/arm64-v8a/libgojni.so "$GITHUB_WORKSPACE/libgojni-arm64.so"
          STRIP=$(find $ANDROID_NDK_HOME -name llvm-strip | head -1)
          $STRIP --strip-unneeded "$GITHUB_WORKSPACE/libgojni-arm64.so"

      - name: Rename .so to .zip
        run: |
          BUILD_TAG="gopeed_$(date +%Y%m%d_%H%M%S)"
          cp libgojni-arm64.so "libgojni_${BUILD_TAG}.zip"
          echo "BUILD_TAG=$BUILD_TAG" >> $GITHUB_ENV

      - name: Print artifact digest
        run: |
          Z=libgojni_${BUILD_TAG}.zip
          echo ARTIFACT_ZIP=$Z
          echo ARTIFACT_SHA256=$(sha256sum $Z | head -c 64)
          echo ARTIFACT_SIZE=$(stat -c%s $Z)
          echo ARTIFACT_SO_SHA256=$(sha256sum libgojni-arm64.so | head -c 64)
          echo ARTIFACT_SO_SIZE=$(stat -c%s libgojni-arm64.so)
          { echo "### core digest"; echo "zip sha256: $(sha256sum $Z | head -c 64)"; echo "zip size: $(stat -c%s $Z)"; } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      # ★★★ 2026-10-16 新增：**可靠的产物上报（artifact）**。
      #   为什么：蓝奏云上传这一步偶发卡死（run #37 就卡在 Upload .so to Lanzou 直到 job 超时），
      #   一旦卡住，产物与 sha256 都拿不回来 → 无法更新 /fastCore 清单 → 核心发不出去。
      #   artifact 上传走 GitHub 自己的存储，稳定且能直接下载（含 .so 与改名后的 .zip）。
      - name: Upload .so artifact (reliable)
        uses: actions/upload-artifact@v4
        with:
          name: libgojni-${{ env.BUILD_TAG }}
          path: |
            libgojni_${{ env.BUILD_TAG }}.zip
            libgojni-arm64.so
          if-no-files-found: error
          retention-days: 30
      - name: Install Python deps
        run: pip install requests -q
      - name: Upload .so to Lanzou (Build folder)
        env:
          LANZOU_USER: ${{ secrets.LANZOU_USER }}
          LANZOU_PASS: ${{ secrets.LANZOU_PASS }}
        run: |
          # ★ 2026-10-16：加 15 分钟硬超时 —— 蓝奏接口偶发卡死（历史多次），
          #   卡死会让整个 job 挂到 60 分钟超时，产物也拿不回来（现在 artifact 已兜底）。
          timeout 900 python3 scripts/lanzou_upload.py upload-nolog "libgojni_${{ env.BUILD_TAG }}.zip" "libgojni_${{ env.BUILD_TAG }}.zip" "Build" "$LANZOU_USER" "$LANZOU_PASS" 2>/dev/null || echo "::warning::蓝奏上传失败/超时，产物见 GitHub artifact"
          echo "PROTECT_NAME=libgojni_${{ env.BUILD_TAG }}.zip" >> $GITHUB_ENV

      - name: Cleanup old builds (keep 5, protect current)
        env:
          LANZOU_USER: ${{ secrets.LANZOU_USER }}
          LANZOU_PASS: ${{ secrets.LANZOU_PASS }}
        run: |
          # ★ 只清理 .so 文件（libgojni_*.zip），保护本次上传；避免误删 APK 与同分钟新文件
          python3 scripts/lanzou_upload.py cleanup "Build" 5 "--protect=${{ env.PROTECT_NAME }}" "$LANZOU_USER" "$LANZOU_PASS" 2>/dev/null || true
name: Private Check (Windows only, no upload)

# 私有验证门禁：确认代码无误后再跑正式发布流水线。
#   - 只编 Windows 便携版（无 native / 无 linux）
#   - 不上传蓝奏云（产物仅 Actions artifact，14 天）
#   - 编译 + 单测门禁 + jdk.httpserver 校验
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "源仓库分支/tag/commit（默认 desktop）"
        required: false
        default: "desktop"
      version:
        description: "版本号"
        required: false
        default: "1.0.1"
      with_gopeed:
        description: "是否捆绑 gopeed 核心"
        required: false
        default: "true"

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SOURCE_REPO: thomas666-u/Starseatool
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Kotlin (gate)
        shell: bash
        run: |
          ./gradlew :shared:compileKotlin :desktop-app:compileKotlin \
            --no-daemon --console=plain
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

      - name: Run unit tests (gate)
        shell: bash
        run: |
          ./gradlew :shared:test :desktop-app:test \
            --no-daemon --console=plain --continue \
            || echo "::warning::部分测试失败（不阻断，请查日志）"
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

      - name: Bundle gopeed core (optional)
        if: ${{ github.event.inputs.with_gopeed != 'false' }}
        shell: bash
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/gopeed-cli/gopeed-cli-win-x64.exe"
          if curl -sL --retry 3 -o gopeed.exe "$URL" && [ -s gopeed.exe ]; then
            echo "gopeed.exe: $(du -h gopeed.exe | cut -f1)"
            echo "=== SHA-256 (供服务端白名单登记) ==="
            sha256sum gopeed.exe
          else
            echo "::warning::gopeed 下载失败"
          fi

      - name: Package Windows portable
        shell: bash
        run: |
          ./gradlew :desktop-app:packageDistributionForCurrentOS \
            --no-daemon --console=plain \
            -PpackageVersion=${{ github.event.inputs.version || '1.0.1' }}
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

      - name: Verify jdk.httpserver in bundled JRE
        shell: bash
        run: |
          MODS=$(find desktop-app/build/compose/binaries -name modules -path '*runtime/lib*' | head -1)
          echo "modules: $MODS"
          [ -f "$MODS" ] || { echo "::error::modules not found"; exit 1; }
          for m in jdk.httpserver com.sun.net.httpserver HttpServer; do
            echo "$m: $(grep -c "$m" "$MODS" || echo 0)"
          done

      - name: Zip
        shell: pwsh
        run: |
          $app = Get-ChildItem -Path "desktop-app\build\compose\binaries" -Directory -Recurse -Filter "StarSea" | Select-Object -First 1
          if (-not $app) { Write-Error "StarSea not found"; exit 1 }
          $out = "StarSea_PrivateCheck_${{ github.event.inputs.version || '1.0.1' }}.zip"
          Compress-Archive -Path $app.FullName -DestinationPath $out -Force
          Write-Host "$out : $([math]::Round((Get-Item $out).Length/1MB,1)) MB"

      - name: Upload artifact (no cloud upload)
        uses: actions/upload-artifact@v4
        with:
          name: StarSea-private-check
          path: StarSea_PrivateCheck_*.zip
          retention-days: 14
